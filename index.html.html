></section><section class="panel"><h2>2. 装備・攻略条件</h2><p class="mini">通常装備は所持値を入力。最適化では「装備なし」＋値が1以上の通常装備＋チェックした特殊装備を1枠ずつ比較します。</p><h3>所持している通常装備（pt相当）</h3><div class="equip-grid"><div><label>HP</label><input id="eqH" type="number" min="0" value="0"></div><div><label>攻撃</label><input id="eqA" type="number" min="0" value="0"></div><div><label>防御</label><input id="eqD" type="number" min="0" value="0"></div><div><label>特殊</label><input id="eqC" type="number" min="0" value="0"></div><div><label>素早さ</label><input id="eqS" type="number" min="0" value="0"></div></div><h3>所持している特殊装備</h3><div id="specialList" class="special-list"></div><h3>攻略条件</h3><div class="row3"><div><label>目標</label><select id="target"><option value="7">7F周回</option><option value="8" selected>8F周回</option><option value="9">9F周回</option><option value="10">10F周回</option></select></div><div><label>回復薬上限</label><select id="potionCap"></select></div><div><label>必要成功率</label><select id="successReq"><option value="90" selected>90%以上</option><option value="95">95%以上</option><option value="99">99%以上</option><option value="100">100%</option></select></div></div><div class="notice">100%は、対象階すべてで敵の回避率が0%になる素早さを確保し、通常クリティカル・回避に頼らない基準で判定します。</div><div class="actions"><button id="optimize">このLvの最適振りを出す</button><button id="simulate" class="secondary">手動配分を確認</button><button id="minLevel" class="secondary">攻略可能最低Lvを出す</button></div><div id="progress" class="progress hidden"><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div id="progressText" class="mini" style="margin-top:5px"></div></div></section><section class="panel wide"><h2>3. 結果</h2><div id="result"><p class="mini">条件を入力して計算してください。</p></div><div id="selftest" class="selftest hidden"></div></section></div></main>
